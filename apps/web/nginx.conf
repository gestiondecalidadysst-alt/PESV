server {
  listen 80;
  root /usr/share/nginx/html;
  # DNS interno de Docker: resuelve «api» aunque el contenedor se reinicie con otra IP.
  resolver 127.0.0.11 valid=30s ipv6=off;
  client_max_body_size 16m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # En producción Caddy envía /api directo a la API; esta ruta sirve para el entorno local.
  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Los archivos con huella en el nombre se guardan un año en el navegador.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html nunca se guarda: así cada despliegue carga la versión nueva.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
