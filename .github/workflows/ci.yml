name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pesv_owner
          POSTGRES_PASSWORD: pesv_owner_dev
          POSTGRES_DB: pesv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pesv_owner -d pesv_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgres://pesv_owner:pesv_owner_dev@localhost:5432/pesv_test
      DATABASE_URL: postgres://pesv_app:pesv_app_dev@localhost:5432/pesv_test
      APP_DB_PASSWORD: pesv_app_dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @pesv/shared build
      - run: pnpm typecheck
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm test
      - run: pnpm build
